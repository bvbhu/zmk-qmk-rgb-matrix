# ZMK QMK-style RGB Matrix Module
#
# This manifest declares the RGB Matrix module as a west project.
# To include this module in a keyboard project, add it to your keyboard's
# config/west.yml as a project.

manifest:
  remotes:
    - name: bvbhu-zmk-qmk-rgb-matrix
      url-base: https://github.com/bvbhu
  projects:
    - name: zmk-qmk-rgb-matrix
      remote: bvbhu-zmk-qmk-rgb-matrix
      revision: main
      path: modules/rgb-matrix
  self:
    path: .
